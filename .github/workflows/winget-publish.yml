name: Submit to winget

# Called only after the installer build/upload matrix succeeds. Submission is
# optional: WINGET_TOKEN is a classic PAT with `public_repo` that can fork
# microsoft/winget-pkgs. A missing token skips successfully; real failures fail.
on:
    workflow_call:
        inputs:
            release-tag:
                required: true
                type: string
        secrets:
            WINGET_TOKEN:
                required: false

jobs:
    winget:
        runs-on: windows-latest
        # Skip pre-releases and skip entirely when no token is configured.
        if: ${{ !github.event.release.prerelease }}
        steps:
            - name: Submit new version to winget-pkgs
              env:
                  WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
                  RELEASE_TAG: ${{ inputs.release-tag }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  if (-not $env:WINGET_TOKEN) {
                      Write-Host 'WINGET_TOKEN not set — skipping winget submission.'
                      exit 0
                  }
                  $version = $env:RELEASE_TAG.TrimStart('v')
                  $installerUrl = "https://github.com/JoernBerkefeld/sfmc-dataloader-app/releases/download/$env:RELEASE_TAG/sfmc-dataloader-app-$version-win-x64.exe"
                  # Fail before submission if the expected published installer is missing.
                  Invoke-WebRequest -Uri $installerUrl -Method Head
                  # wingetcreate downloads the installer, computes the SHA256 and
                  # opens a PR against microsoft/winget-pkgs from the existing manifest.
                  Invoke-WebRequest -Uri 'https://aka.ms/wingetcreate/latest' -OutFile wingetcreate.exe
                  .\wingetcreate.exe update JoernBerkefeld.SFMCDataLoader `
                      --version $version `
                      --urls $installerUrl `
                      --submit `
                      --token $env:WINGET_TOKEN
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
