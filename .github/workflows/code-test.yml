name: Lint & Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: [22, 24, 25]
        name: lint & test w/ node v${{ matrix.node }}
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
            - run: npm ci --no-workspaces
            - run: npm run lint
            - name: Initialize Electron before parallel tests
              run: node -e "console.log(require('electron'))"
            - name: Configure Linux Electron sandbox
              shell: bash
              run: |
                  electron_path=$(node -p "require('electron')")
                  sandbox_path="$(dirname "$electron_path")/chrome-sandbox"
                  sudo chown root:root "$sandbox_path"
                  sudo chmod 4755 "$sandbox_path"
            - run: xvfb-run -a npm test --no-workspaces
